<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AnimeFlix - Watch Anime Online</title>
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  </head>
  <body>
    <div id="app">
      <div class="header">
        <h1>🎌 AnimeFlix</h1>
        <p>Stream your favorite anime with ease</p>
      </div>

      <div class="search-container">
        <input 
          type="text" 
          id="searchInput" 
          placeholder="Search anime (e.g., Naruto, Attack on Titan)..."
          autocomplete="off"
        />
        <button id="searchBtn">Search</button>
      </div>

      <div id="results"></div>

      <div id="details"></div>

      <div id="episodes"></div>

      <div id="servers"></div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
